<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BP Exchange Max</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  height: 100vh;
  background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
  color: white;
  overflow-x: hidden;
}

/* Background glow */
body::before {
  content: '';
  position: fixed;
  width: 300%;
  height: 300%;
  background: radial-gradient(circle, rgba(0,255,255,0.15), transparent 60%);
  animation: rotate 20s linear infinite;
}

@keyframes rotate {
  0% { transform: rotate(0deg);}
  100% { transform: rotate(360deg);}
}

.container {
  text-align: center;
  padding: 80px 20px;
  z-index: 1;
  position: relative;
}

/* Title */
h1 {
  font-size: 3.5rem;
  background: linear-gradient(45deg, #00f2ff, #ff00ff);
  -webkit-background-clip: text;
  color: transparent;
}

p {
  margin-top: 10px;
  opacity: 0.8;
}

/* Card */
.card {
  margin: 50px auto;
  padding: 30px;
  width: 90%;
  max-width: 400px;
  border-radius: 20px;
  backdrop-filter: blur(15px);
  background: rgba(255,255,255,0.05);
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-10px);
}

/* Button */
.btn {
  display: inline-block;
  margin-top: 20px;
  padding: 15px 35px;
  border-radius: 30px;
  background: linear-gradient(45deg, #00f2ff, #ff00ff);
  color: white;
  text-decoration: none;
  font-weight: bold;
  transition: 0.3s;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.btn:hover {
  transform: scale(1.1);
  box-shadow: 0 15px 40px rgba(0,0,0,0.7);
}

/* Features */
.features {
  margin-top: 60px;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
}

.feature {
  margin: 15px;
  padding: 20px;
  width: 250px;
  border-radius: 15px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px);
  transition: 0.3s;
}

.feature:hover {
  transform: scale(1.05);
}

/* Footer */
.footer {
  margin-top: 80px;
  opacity: 0.6;
  font-size: 0.9rem;
}

</style>
</head>

<body>

<div class="container">
  <h1>BP Exchange Max</h1>
  <p>Fast. Secure. Powerful Exchange Experience</p>

  <div class="card">
    <h2>Download Now</h2>
    <p>Get instant access to a smooth and secure platform</p>
    
    <a href="https://github.com/TxDevelopers/bp-exchange-max/releases/download/app/bp.exchange.max.apk" class="btn">
      Download APK
    </a>
  </div>

  <div class="features">
    <div class="feature">
      ⚡ Fast Transactions
    </div>
    <div class="feature">
      🔒 Secure System
    </div>
    <div class="feature">
      📱 Easy to Use
    </div>
  </div>

  <div class="footer">
    © 2026 BP Exchange Max
  </div>
</div>

</body>
</html>
